<!doctype html>
<html lang="sv">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>30 i veckan</title>
  <link rel="stylesheet" href="./thirty/styles.css" />
</head>

<body>
  <div class="confetti-stage cannon-stage" aria-hidden="true">
    <div class="cannon-piece"></div>
    <div class="cannon-piece"></div>
    <div class="cannon-piece"></div>
    <div class="cannon-piece"></div>
    <div class="cannon-piece"></div>
    <div class="cannon-piece"></div>
    <div class="cannon-piece"></div>
    <div class="cannon-piece"></div>
    <div class="cannon-piece"></div>
    <div class="cannon-piece"></div>
    <div class="cannon-piece"></div>
    <div class="cannon-piece"></div>
    <div class="cannon-piece"></div>
    <div class="cannon-piece"></div>
    <div class="cannon-piece"></div>
    <div class="cannon-piece"></div>
    <div class="cannon-piece"></div>
    <div class="cannon-piece"></div>
  </div>
  <div class="page-shell">
    <header class="hero">
      <div>
        <p class="eyebrow">30-a-week tracker</p>
        <h1>Markera allt du ätit den här veckan.</h1>
        </p>
      </div>
    </header>

    <main>
      <section class="panel panel-sheet">
        <div class="panel-header">
          <h2>Veckans checklista: <span data-total-points>0</span></h2>

          <p>Kryssa i det du har ätit. Du kan avmarkera när som helst.</p>
        </div>

        <div class="sheet-controls">
          <label class="field-label" for="search">Sök i listan</label>
          <input id="search" class="search-input" type="search" placeholder="Till exempel broccoli, kiwi eller linser"
            autocomplete="off" />
        </div>
        <div class="results-header">

          <span>Kryssa i det du har ätit</span>
          <button class="ghost-button" data-clear-log type="button">Nollställ alla kryss</button>
        </div>
        <div class="food-sheet" data-food-sheet></div>
      </section>
    </main>
  </div>

  <script src="./thirty/foods-data.js"></script>
  <script src="./thirty/app.js"></script>
</body>

</html>
